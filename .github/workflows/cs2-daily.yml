name: CS2 daily V2.5 and V2.6

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 20:00 Asia/Shanghai; GitHub scheduled starts may be delayed

permissions:
  contents: write
  issues: write

concurrency:
  group: cs2-daily
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pandas openpyxl requests tqdm
      - name: Run once and create both reports
        env:
          STEAMDT_API_KEY: ${{ secrets.STEAMDT_API_KEY }}
        run: |
          test -n "$STEAMDT_API_KEY" || { echo 'Missing STEAMDT_API_KEY secret'; exit 1; }
          mkdir -p reports
          cd reports
          python ../cs2_daily.py
          test -n "$(find . -maxdepth 1 -name 'CS2_V25_Daily_Report_*.xlsx' -print -quit)"
          test -n "$(find . -maxdepth 1 -name 'CS2_V26_Daily_Report_*.xlsx' -print -quit)"
      - name: Push daily output
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add reports/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily CS2 V2.5 and V2.6 reports"
          git push
      - name: Notify owner with report links
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          day=$(TZ=Asia/Shanghai date +%F)
          title="CS2 双报告 ${day}"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all --limit 1000 --json title,number \
            --jq ".[] | select(.title == \"${title}\") | .number" | head -1)
          if [ -n "$existing" ]; then
            echo "Today's report issue already exists: #$existing"
            exit 0
          fi
          report_base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/reports"
          cat > /tmp/cs2_daily_notice.md <<EOF
          @${GITHUB_REPOSITORY_OWNER} 今天的两套评分报告已更新：

          - [V2.5 报告](${report_base}/CS2_V25_Daily_Report_${day}.md)
          - [V2.6 报告](${report_base}/CS2_V26_Daily_Report_${day}.md)
          - [查看全部原始结果](https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/reports)

          报告按同一轮行情和 K 线生成；评分是观察信号，不保证未来收益。
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$title" --body-file /tmp/cs2_daily_notice.md \
            --assignee "$GITHUB_REPOSITORY_OWNER"
